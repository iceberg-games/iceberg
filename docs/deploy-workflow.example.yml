# EXAMPLE ONLY (inert here). Copy to .github/workflows/deploy.yml to deploy to GitHub Pages.
# Secrets: SUPABASE_URL, SUPABASE_ANON_KEY, optional SUPABASE_DB_URL (runs migrations + price sync).
name: Deploy Iceberg
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    env: { SUPABASE_DB_URL: '${{ secrets.SUPABASE_DB_URL }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci && (cd tools/db && npm ci)
      - run: npx playwright install --with-deps chromium && npm test
      - name: Migrate + sync prices/phrases/games
        if: ${{ env.SUPABASE_DB_URL != '' }}
        run: sudo apt-get install -y postgresql-client && node scripts/migrate.mjs --remote
      - run: node scripts/build-site.mjs --out dist-site
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_USERNAME_EMAIL_DOMAIN: users.iceberg.invalid
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist-site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
